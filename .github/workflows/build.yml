name: Build & publish APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android 17 SDK platform (uses the runner's preinstalled SDK)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" || true

      - name: Build APK
        run: |
          # Prefer the Gradle preinstalled on the runner; fall back to the wrapper (with retries)
          if command -v gradle >/dev/null && gradle --version | grep -qE "Gradle (9\.([6-9]|[1-9][0-9])|[1-9][0-9])"; then
            gradle --version
            gradle --no-daemon assembleDebug
          else
            for i in 1 2 3 4 5; do ./gradlew --no-daemon assembleDebug && exit 0; echo "retry $i"; sleep 30; done
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HelloWorld.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" HelloWorld.apk \
            --title "Hello World v1.0.${{ github.run_number }}" \
            --notes "Install on your phone: download HelloWorld.apk below and open it." \
            --latest
